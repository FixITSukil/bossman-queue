name: Enable barber quick-service UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-barber-quick-service-loader.yml

permissions:
  contents: write

jobs:
  patch-api-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Append quick-service loader to api.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("api.js")
          text = path.read_text(encoding="utf-8")
          marker = "bossman-quick-service-loader"

          if marker not in text:
              text += r'''

// Barber-only quick-service insertion UI loader.
(function loadBossmanQuickServiceUi() {
  function load() {
    if (!document.getElementById("barber-name")) return;
    if (document.getElementById("bossman-quick-service-loader")) return;
    var script = document.createElement("script");
    script.id = "bossman-quick-service-loader";
    script.src = "barber-quick-service.js?v=20261017a";
    document.body.appendChild(script);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", load);
  else load();
})();
'''
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit loader
        run: |
          if git diff --quiet -- api.js; then
            echo "Quick-service loader already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.js
          git commit -m "Load barber quick-service queue controls"
          git push
